# Einstellungen der Trading-Software (Phase 2: Datenbasis)

[mt5]
# Pfad zu terminal64.exe – leer lassen, um das laufende/zuletzt genutzte Terminal zu verwenden
terminal_path = ""

[data]
root = "data"                 # lokale Parquet-Datenbank
report_dir = "reports"
symbols = ["XAUUSD", "BTCUSD"]
timeframes = ["M1", "M5", "M15", "M30", "H1", "H4", "D1"]
conversion_timeframes = ["M5", "H1", "D1"]   # für Umrechnungssymbole wie EURUSD
chunk_bars = 40000            # Kerzen pro Abfrage (Phase 1: 100 000 abgelehnt, 50 000 funktionierten)
earliest = "2000-01-01"       # weiter zurück wird nicht gesucht

[timezone]
# "auto" = aus den Daten erkennen (empfohlen). Fest: "ny_close" (UTC+2/+3 nach US-Sommerzeit),
# "eu_dst" (UTC+2/+3 nach EU-Sommerzeit) oder "fixed:+03:00"
server = "auto"
reference_symbol = "XAUUSD"   # Symbol mit fester täglicher Handelspause (für die Erkennung)

[calendars]
# Handelskalender je Symbol: "cme_metals" (Gold, New Yorker Handelszeiten) oder "24x7"
XAUUSD = "cme_metals"
BTCUSD = "24x7"

[quality]
session_tolerance_min = 20
low_activity_max_min = 5
outlier_z = 15.0
spike_z = 8.0
range_factor = 25.0
window = 1000
recurring_min_weeks = 3

[paper]
# Phase 4 – Beobachtung (Paper-Trading): keine Orders, nur Protokoll. Risiko und Kapital sind NICHT hier
# einstellbar (fest im Programm, Freigabe 20.10.2026: 1 000 € Referenzkapital, 1 % je Trade, 3 % Tagesverlust,
# 20 % Drawdown-Grenze, max. 2 Positionen).
interval_s = 60          # Sekunden zwischen zwei Durchläufen
warmup_bars = 3000       # Kerzen vor Beobachtungsbeginn für die Indikatoren
stale_after_s = 300      # älterer Tick = keine aktuellen Kurse
max_delay_s = 300        # später erkannte Signale werden nicht gehandelt (Programm lief nicht)
cost_scenario = "konservativ"

# Forschungskandidat "Bitcoin-Trendfolge auf M30/H1" aus Phase 3 – Parameter unverändert
[[paper.candidates]]
symbol = "BTCUSD"
timeframe = "H1"
strategy = "kombi_breakout_momentum"
params = { n = 55, rr = 3.0 }

[[paper.candidates]]
symbol = "BTCUSD"
timeframe = "H1"
strategy = "donchian_breakout"
params = { n = 55, atr_mult = 2.5 }

[[paper.candidates]]
symbol = "BTCUSD"
timeframe = "H1"
strategy = "ema_trend"
params = { fast = 50, slow = 200, atr_mult = 3.0 }

[[paper.candidates]]
symbol = "BTCUSD"
timeframe = "M30"
strategy = "ema_trend"
params = { fast = 50, slow = 200, atr_mult = 3.0 }

[[paper.candidates]]
symbol = "BTCUSD"
timeframe = "M15"
strategy = "sma_box_trend"
params = {}

[[paper.candidates]]
symbol = "XAUUSD"
timeframe = "M15"
strategy = "sma_box_trend"
params = {}

[execution]
# Phase 5 (Freigabe 21.10.2026): Orders für die Signale aller Kandidaten oben – NUR auf einem DEMOKONTO.
# Bei einem Echtgeldkonto sendet das Programm keine Orders (fest im Code). false = nur beobachten.
orders_enabled = true
deviation_points = 100
